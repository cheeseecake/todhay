services:

  backend:
    container_name: backend
    build: ./backend
    restart: always
    volumes:
      - ./backend:/backend
      
  nginx:
    container_name: nginx
    image: nginx:mainline
    restart: always
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "443:443"
    environment:
      TZ: Asia/Singapore
    extra_hosts:
      - "host.docker.internal:host-gateway"
